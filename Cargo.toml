[package]
name = "claudio"
version = "0.8.0"
edition = "2021"
description = "Drop-in `claude` wrapper emulating `-p`, with an optional OpenAI-compatible API server (--api) routed through the same PTY-driven backend (responsible-disclosure research)"

[[bin]]
name = "claudio"
path = "src/main.rs"

[[test]]
name = "remote"
path = "tests/remote.rs"
required-features = ["diag"]

[[test]]
name = "screenshots"
path = "tests/screenshots.rs"

[features]
default = ["api", "web", "vocdoni"]
# The addons this binary links (docs/addons.md). Without any, the core alone (ACCEPTANCE A4).
api = []
web = []
vocdoni = []
# Enables diagnostic / test-harness CLI subcommands (`__bootstrap`,
# `__connect-check`, `__remote-session`, `__ssh-hosts`, `__remote-manifest`).
# Not included in production release builds.
diag = []

[dependencies]
# Core -p (print-mode) emulation backend.
portable-pty = "0.8"
vte = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"

# OpenAI-compatible API server (--api). Only exercised in API mode, but linked
# unconditionally so a single static binary serves both roles.
serde = { version = "1", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Session manager (bare `claudio`): TUI client + per-host daemon.
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
alacritty_terminal = "0.26"
libc = "0.2"
toml = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
unicode-segmentation = "1"
unicode-width = "0.2"
# The reader view's markdown (claude's answers). Pure Rust; no default
# features (no HTML output). Pinned exactly: the reader's hostile-input
# bounds were measured against this version.
pulldown-cmark = { version = "=0.13.6", default-features = false }
# `claudio web`: the embedded browser app is stored gzipped (build.rs) and
# decompressed for a client without gzip; base64 for the import-map hash in
# debug disk mode. Pure Rust (flate2's default miniz_oxide backend).
flate2 = "1"
base64 = "0.22"

[build-dependencies]
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"

# Only needed in integration tests (no runtime dep).
[dev-dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["test-util"] }
# `claudio web`'s WebSocket in tests/web.rs: the version axum's `ws` feature
# pulls, so one copy builds.
tokio-tungstenite = "0.29"

[profile.release]
strip = true

# Every daemon start and connect hashes the claudio binary (the freshness
# check); unoptimized, that takes seconds on a debug build.
[profile.dev.package.sha2]
opt-level = 3
