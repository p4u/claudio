[package]
name = "claudio"
version = "0.1.0"
edition = "2021"
description = "Drop-in `claude` wrapper emulating `-p`, with an optional OpenAI-compatible API server (--api) routed through the same PTY-driven backend (responsible-disclosure research)"

[[bin]]
name = "claudio"
path = "src/main.rs"

[dependencies]
# Core -p (print-mode) emulation backend.
portable-pty = "0.8"
vte = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"

# OpenAI-compatible API server (--api). Only exercised in API mode, but linked
# unconditionally so a single static binary serves both roles.
serde = { version = "1", features = ["derive"] }
axum = "0.8"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Session manager (bare `claudio`): TUI client + per-host daemon.
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
alacritty_terminal = "0.26"
libc = "0.2"
toml = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Only needed in integration tests (no runtime dep).
[dev-dependencies]
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
