[package]
name = "claude-poc"
version = "0.1.0"
edition = "2021"
description = "Reference PoC: drive interactive Claude Code under a PTY to emulate claude -p (responsible-disclosure research)"

[[bin]]
name = "claude-poc"
path = "src/main.rs"

[dependencies]
portable-pty = "0.8"
vte = "0.13"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[profile.release]
strip = true
