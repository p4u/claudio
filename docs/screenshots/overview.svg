<text y="172.8" class="t" xml:space="preserve"><tspan x="8.0" style="fill:#f38ba8">▎</tspan><tspan x="23.6" style="fill:#ffffff;font-weight:bold">Auto mode is now Claude Code's default permission mode.</tspan></text>
<text y="191.8" class="t" xml:space="preserve"><tspan x="8.0" style="fill:#f38ba8">▎</tspan><tspan x="23.6" style="fill:#bac2de">Auto mode lets Claude handle permission prompts automatically. Claude checks each tool call for risky actions and prompt injection before </tspan></text>
<text y="210.8" class="t" xml:space="preserve"><tspan x="8.0" style="fill:#f38ba8">▎</tspan><tspan x="23.6" style="fill:#bac2de">executing, runs the ones it assesses as lower-risk, and blocks the rest.</tspan></text>
<text y="229.8" class="t" xml:space="preserve"><tspan x="8.0" style="fill:#f38ba8">▎</tspan><tspan x="23.6" style="fill:#bac2de">https://code.claude.com/docs/en/permission-modes</tspan></text>
