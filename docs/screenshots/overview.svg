<text y="267.8" class="t" xml:space="preserve"><tspan x="8.0" style="fill:#a6adc8">●</tspan><tspan x="15.8" style="fill:#cdd6f4"> This is a small demo React web app built with Vite. Going by its file names, it has a login screen, a navbar, session handling, dark-mode </tspan></text>
